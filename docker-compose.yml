services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cfa
      POSTGRES_PASSWORD: cfa_local_dev
      POSTGRES_DB: cfa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfa -d cfa"]
      interval: 3s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://cfa:cfa_local_dev@db:5432/cfa
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  pgdata:
  ollama_data:
